}

/* Define the keyframes for the shake animation */

<script>
  // Get the element by its ID
  const textElement = document.getElementById('button');

  // Array of colors to cycle through
  const colors = ['gold', 'palevioletred', 'purple', 'palevioletred', 'gold'];
  let colorIndex = 0;

  // Function to change the text color
  function changeColor() {
    // Change the color of the text element
    textElement.style.color = colors[colorIndex];

    // Move to the next color in the array
    colorIndex = (colorIndex + 1) % colors.length;
  }

  // Call the changeColor function every 1000 milliseconds (1 seconds)
  setInterval(changeColor, 1000);

  // Call changeColor immediately on page load to set the initial color
  changeColor();
</script>
