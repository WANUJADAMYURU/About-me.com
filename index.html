<!DOCTYPE html>
 <html lang="en" oncontextmenu="return false;"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="Damyuru2.jpeg">
<title>Login</title>
<style> 
body { font-family: Arial, sans-serif;
       /* The image used */
       background-image: url("sidenav.jpg");
       /* Add the blur effect */
       filter: blur(8px);
       -webkit-filter: blur(0px);
       /* Center and scale the image nicely */
       background-position: center;
       background-repeat: no-repeat;
       background-size: cover; 
       display: flex; 
       justify-content: center; 
       align-items: center; 
       height: 100vh; 
       margin: 0; }

.login-box {background: white;
            padding: 35px; 
            border-radius: 12px; 
            text-align: center; 
            width: 300px; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); }

h2 { color: black; }

input { width: 100%; padding: 12px 0; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 16px; }

button { width: 100%; padding: 12px; background: grey; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }

button:hover { background: rgba(0, 0, 0, 0.4); }

#message { color: red; margin-top: 12px; }
* {
            box-sizing: border-box;
        }

/* Normal slideshow */
  .slideshow {
    position: relative;
    width: 100%;
    max-width: 650px;
    height: 350px;
    margin: 25px auto;
    overflow: hidden;
    border-radius: 14px;
    background: #111;
    box-shadow: 0 5px 20px #0002;
  }

  .slide-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: zoom-in;
    display: block;
  }

  .slide-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px 15px 15px;
    color: white;
    background: linear-gradient(transparent, #000b);
    pointer-events: none;
  }

  .controls {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    pointer-events: none;
  }

  .controls button,
  .top-controls button {
    pointer-events: auto;
    border: 0;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    color: white;
    background: #0009;
    font-size: 23px;
    cursor: pointer;
  }

  .controls button:hover,
  .top-controls button:hover {
    background: #000d;
  }

  .top-controls {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
  }

  .top-controls button {
    font-size: 19px;
  }

  .slide-status {
    position: absolute;
    top: 17px;
    left: 15px;
    color: white;
    background: #0008;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
  }

  /* Fullscreen overlay mode */
  .slideshow.expanded {
    position: fixed;
    inset: 0;
    z-index: 99999;
    width: 100%;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    border-radius: 0;
    box-shadow: none;
    background: #080808;
  }

  .slideshow.expanded .slide-image {
    object-fit: contain;
    cursor: zoom-out;
  }

  .slideshow.expanded .controls {
    padding: 25px;
  }

  .slideshow.expanded .controls button {
    width: 54px;
    height: 54px;
    font-size: 30px;
  }

  .slideshow.expanded .top-controls {
    top: 20px;
    right: 20px;
  }

  .slideshow.expanded .slide-caption {
    text-align: center;
    font-size: 18px;
  }

  .slideshow.expanded .slide-status {
    top: 25px;
    left: 25px;
  }

  .mode-label {
    text-align: center;
    color: #666;
    font-size: 14px;
  }       
</style> 
</head>

<body>
<div class="slideshow" id="slideshow">
    <img
      id="slideImage"
      class="slide-image"
      src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1400"
      alt="Mountain lake"
      tabindex="0"
      role="button"
      aria-label="Expand photo slideshow"
    >

    

    <div class="slide-caption" id="slideCaption">
      Welcome! I am Wanuja
    </div>

    <div class="controls">
      <button id="previousBtn" aria-label="Previous photo">❮</button>
      <button id="nextBtn" aria-label="Next photo">❯</button>
    </div>

    <div class="top-controls">
      <button id="autoBtn" aria-label="Pause automatic slideshow"
              title="Pause or play">Ⅱ</button>
      <button id="expandBtn" aria-label="Expand slideshow"
              title="Expand">⛶</button>
      <button id="closeBtn" aria-label="Minimize slideshow"
              title="Minimize" hidden>✕</button>
    </div>
  </div>
<div class="login-box"> <h2>Login</h2><img width="73.44px" height="66.48px" src="Damyuru2.jpeg" style="border-radius: 50%"/> <p>Enter password on my C.V. to continue</p>

<form id="loginForm"> <input type="password" id="password" placeholder="Enter password" required >

<button type="submit">Login</button> </form>

<p id="message"></p> </div>

<script src="wanuja.js"></script>
<script>
  const photos = [
    {
      src: "img.jpg",
      caption: "Welcome! I am Wanuja"
    },
    {
      src: "https://picjumbo.com/wp-content/uploads/beautiful-nature-scenery-free-photo-2210x1473.jpg",
      caption: "A Nature Lover"
    },
    {
      src: "https://tse1.mm.bing.net/th/id/OIP.fj2jV4HDxQ_SI642iyr73AHaEO?r=0&rs=1&pid=ImgDetMain&o=7&rm=3",
      caption: "A Music Lover"
    },
    {
      src: "https://tse3.mm.bing.net/th/id/OIP.0vJ0tmOZvIbfHZ3NodclRQHaEO?r=0&rs=1&pid=ImgDetMain&o=7&rm=3",
      caption: "A Researcher"
    }
  ];

  const slideshow = document.getElementById("slideshow");
  const image = document.getElementById("slideImage");
  const caption = document.getElementById("slideCaption");
  const status = document.getElementById("slideStatus");
  const autoBtn = document.getElementById("autoBtn");
  const expandBtn = document.getElementById("expandBtn");
  const closeBtn = document.getElementById("closeBtn");

  let currentIndex = 0;
  let expanded = false;
  let playing = true;

  function showSlide(index) {
    currentIndex = (index + photos.length) % photos.length;
    image.src = photos[currentIndex].src;
    image.alt = photos[currentIndex].caption;
    caption.textContent = photos[currentIndex].caption;
    status.textContent =
      `${currentIndex + 1} / ${photos.length}`;
  }

  function nextSlide() {
    showSlide(currentIndex + 1);
  }

  function previousSlide() {
    showSlide(currentIndex - 1);
  }

  function setPlaying(value) {
    playing = value;
    autoBtn.textContent = playing ? "Ⅱ" : "▶";
    autoBtn.setAttribute(
      "aria-label",
      playing ? "Pause automatic slideshow" :
                "Play automatic slideshow"
    );
  }

  function expandSlideshow() {
    if (expanded) return;

    expanded = true;
    slideshow.classList.add("expanded");
    expandBtn.hidden = true;
    closeBtn.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function minimizeSlideshow() {
    if (!expanded) return;

    expanded = false;
    slideshow.classList.remove("expanded");
    expandBtn.hidden = false;
    closeBtn.hidden = true;
    document.body.style.overflow = "";
  }

  document.getElementById("nextBtn")
    .addEventListener("click", nextSlide);

  document.getElementById("previousBtn")
    .addEventListener("click", previousSlide);

  image.addEventListener("click", expandSlideshow);
  expandBtn.addEventListener("click", expandSlideshow);
  closeBtn.addEventListener("click", minimizeSlideshow);

  image.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      expandSlideshow();
    }
  });

  autoBtn.addEventListener("click", () => {
    setPlaying(!playing);
  });

  // Keyboard controls in expanded mode
  document.addEventListener("keydown", event => {
    if (!expanded) return;

    if (event.key === "Escape") minimizeSlideshow();
    if (event.key === "ArrowRight") nextSlide();
    if (event.key === "ArrowLeft") previousSlide();
  });

  // Automatic slideshow: change photo every 4 seconds
  setInterval(() => {
    if (playing) nextSlide();
  }, 4000);

  showSlide(0);
</script>
</body> 
</html>
